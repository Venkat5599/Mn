# Envio HyperIndex config. Addresses come from deployments/<chainId>.json after `bun run deploy`.
name: pitchside
description: Pitchside rooms, bets, pitches and settlements
contracts:
  - name: PitchsideRooms
    handler: src/EventHandlers.ts
    events:
      - event: RoomCreated(uint256 indexed roomId, address indexed host, uint8 mode, uint32 gamePk)
      - event: GameSet(uint256 indexed roomId, uint32 gamePk)
      - event: Joined(uint256 indexed roomId, address indexed player, uint256 credited)
      - event: BetPlaced(uint256 indexed roomId, uint32 indexed gamePk, uint16 indexed seq, address player, uint8 outcome, uint96 amount)
      - event: BetResolved(uint256 indexed roomId, uint32 indexed gamePk, uint16 indexed seq, address player, uint8 picked, uint96 amount, uint256 payout, bool refunded)
      - event: MarketSettled(uint256 indexed roomId, uint32 indexed gamePk, uint16 indexed seq, uint8 outcome, uint256 pot, uint256 rake)
      - event: CashedOut(uint256 indexed roomId, address indexed player, address to, uint256 amount)
  - name: PitchOracle
    handler: src/EventHandlers.ts
    events:
      - event: PitchReported(uint32 indexed gamePk, uint16 indexed seq, uint8 outcome, uint64 startTs, uint64 endTs, uint64 nextLockAt)
      - event: PitchConfirmed(uint32 indexed gamePk, uint16 indexed seq, uint8 reported, bool matched)
      - event: PitchVoided(uint32 indexed gamePk, uint16 indexed seq)
networks:
  - id: 10143 # Monad testnet
    start_block: 0 # set to deployments/10143.json startBlock
    contracts:
      - name: PitchsideRooms
        address: ["0x0000000000000000000000000000000000000000"]
      - name: PitchOracle
        address: ["0x0000000000000000000000000000000000000000"]
