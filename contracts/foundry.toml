[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 10_000
via_ir = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
monad_mainnet = "${MONAD_MAINNET_RPC_URL}"

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false

[lint]
# Public immutables are part of the ABI the app reads (oracle(), stakeToken(), lockDelay()).
exclude_lints = ["screaming-snake-case-immutable", "unwrapped-modifier-logic"]
